name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  UBER_SIGNER_VERSION: '1.3.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # No gradle-wrapper.jar in the repo, so install Gradle 7.5 directly
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # Every runner generates a different debug key, so re-sign with the
      # debug keystore embedded in uber-apk-signer: same signature on every build.
      - name: Download uber-apk-signer
        run: |
          curl -fL -o uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v${UBER_SIGNER_VERSION}/uber-apk-signer-${UBER_SIGNER_VERSION}.jar"

      - name: Sign APK with debug key
        run: |
          java -jar uber-apk-signer.jar \
            --apks app/build/outputs/apk/debug \
            --allowResign \
            --out signed

      - name: Show signature
        run: java -jar uber-apk-signer.jar --apks signed --onlyVerify

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YtDownloader-signed
          path: signed/*.apk
          if-no-files-found: error
